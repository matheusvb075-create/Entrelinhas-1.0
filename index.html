<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrelinhas</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#151a24">
<meta name="apple-mobile-web-app-title" content="Entrelinhas">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--tx:#151a24;--mu:#636d7e;--g:#151a24;--gd:#0c1017;--og:#fff;--tint:#eef0f5;--hero:linear-gradient(135deg,#e8ecf4,#dde3ee);--ln:#dde1ea;
--desk:#1b2230;--desk2:#0e121a;--bar:#0a0e14;--brass:#cfd6e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1118;--tx:#eef1f6;--mu:#97a1b2;--g:#e9edf5;--gd:#c9d0de;--og:#151a24;--tint:#171d28;--hero:linear-gradient(135deg,#1a2231,#202a3d);--ln:#252d3b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1118;--tx:#eef1f6;--mu:#97a1b2;--g:#e9edf5;--gd:#c9d0de;--og:#151a24;--tint:#171d28;--hero:linear-gradient(135deg,#1a2231,#202a3d);--ln:#252d3b}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
#home{height:100%;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:.75rem;padding:1rem 1.1rem .4rem}
.av{width:2.9rem;height:2.9rem;border-radius:12px;background:var(--g);color:var(--og);display:grid;place-items:center;font-size:1.4rem}
.hd .av{width:2.3rem;height:2.3rem;border-radius:10px;font-size:1.1rem}.hd .pill{margin-left:auto}
.pill{background:var(--g);color:var(--og);font-weight:700;border-radius:999px;padding:.6rem 1.05rem}
#main{flex:1;min-height:0;overflow-y:auto;padding:0 1.1rem 1.5rem}
h2{font-size:1.4rem;margin:1.6rem 0 .8rem}
.hero{display:flex;gap:1rem;align-items:center;background:var(--hero);border-radius:20px;padding:1rem;margin-top:.8rem}
.hero .cv{width:34%;flex:none;border-radius:12px}
.hero b{display:block;font-size:1.1rem;line-height:1.25;margin-bottom:.3rem}
.hero span{color:var(--mu);font-size:.95rem}
.hero button{margin-top:.9rem;background:var(--g);color:var(--og);font-weight:700;border-radius:999px;padding:.65rem 1.1rem}
.row{display:flex;gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -1.1rem;padding:0 1.1rem;scrollbar-width:none}
.row .bk{flex:none;width:max(150px,42vw);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem .9rem}
.bk{cursor:pointer;position:relative}
.cv{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden}
.cv img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:84%;max-width:80%;object-fit:contain;box-shadow:0 4px 14px #0004;background:#fff}
.cv i{position:absolute;left:0;bottom:0;height:5px;background:var(--g);z-index:2}
.bk p{margin:.55rem 0 0;font-weight:600;font-size:.95rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk small{color:var(--mu)}
.rm{position:absolute;top:.4rem;right:.4rem;width:2rem;height:2rem;border-radius:50%;background:#000a;color:#fff;font-size:1.1rem;z-index:3}
.empty{background:var(--hero);border-radius:20px;padding:1.6rem 1.2rem;margin-top:1rem}
.empty b{display:block;font-size:1.3rem;margin-bottom:.4rem}
.empty p{margin:0 0 1rem;color:var(--mu);line-height:1.45}
.tabs{display:flex;border-top:1px solid var(--ln);background:var(--bg)}
.tabs button{flex:1;padding:.7rem 0 .75rem;color:var(--mu);font-size:.85rem}
.tabs button.on{color:var(--g);font-weight:700}
.tabs span{display:block;font-size:1.3rem;margin-bottom:.1rem}
.av{cursor:pointer;overflow:hidden}.av img{width:100%;height:100%;display:block;object-fit:cover}.av:has(img){background:#050505}.av.big{width:5rem;height:5rem;font-size:2.2rem;border-radius:20px;flex:none}
.me{display:flex;gap:1rem;align-items:flex-end;margin-top:1rem}.me label{flex:1;font-weight:600;font-size:.9rem;color:var(--mu)}
.me input{display:block;width:100%;margin-top:.35rem;padding:.75rem .9rem;border:1px solid var(--ln);border-radius:12px;background:var(--tint);color:var(--tx);font:inherit;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.2rem}.stats div{background:var(--tint);border-radius:14px;padding:.9rem .5rem;text-align:center}.stats b{display:block;font-size:1.6rem}.stats span{color:var(--mu);font-size:.8rem}
.seg{display:flex;background:var(--tint);border-radius:999px;padding:.25rem}.seg button{flex:1;padding:.55rem 0;border-radius:999px;color:var(--mu)}.seg button.on{background:var(--g);color:var(--og);font-weight:700}
.mu{color:var(--mu);margin:0 0 .8rem}
.avw{position:relative;flex:none;border-radius:20px}.avw .av{pointer-events:none}.plus{position:absolute;right:-.3rem;bottom:-.3rem;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--g);color:var(--og);display:grid;place-items:center;font-weight:700;font-size:1.2rem;border:2px solid var(--bg);line-height:1}.rm.ed{right:2.9rem}.del{color:#d93a3a;font-weight:700;padding:.5rem}.dlg label{font-weight:600;font-size:.9rem;color:var(--mu)}.dlg input{display:block;width:100%;margin-top:.35rem;padding:.75rem .9rem;border:1px solid var(--ln);border-radius:12px;background:var(--tint);color:var(--tx);font:inherit;font-size:1rem}
.rmf{color:var(--g);text-decoration:underline;padding:0;margin:.4rem 0 0;font-size:.85rem}
#perm,#edd{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:30;padding:1rem}.dlg{background:var(--bg);border-radius:20px;padding:1.3rem;max-width:26rem;width:100%;display:flex;flex-direction:column;gap:.7rem}.dlg b{font-size:1.2rem}.dlg p{margin:0;color:var(--mu);line-height:1.45}.dlg button:last-child{color:var(--mu);padding:.5rem}
#toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:#000c;color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.9rem;z-index:20}
#reader{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,var(--desk),var(--desk2));color:#f3ecd9;font-family:Georgia,serif}
.top,.bot{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:var(--bar)}
.top button,.bot button{border:1px solid #ffffff30;border-radius:8px;padding:.5rem .8rem}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:12px;touch-action:none;overflow:hidden}
#book{position:relative;display:flex;width:var(--pw);height:var(--ph);perspective:2400px}
#book.dual{width:calc(var(--pw)*2)}
.pg{width:var(--pw);height:var(--ph);background:#fbf8ef;overflow:hidden;box-shadow:0 10px 30px #0007}
.pg img{display:block;width:100%;height:100%;object-fit:contain}
#book:not(.dual) #L{display:none}
#L{border-radius:3px 0 0 3px;box-shadow:inset -22px 0 24px -18px #0006,0 10px 30px #0007}
#book.dual #R{border-radius:0 3px 3px 0;box-shadow:inset 22px 0 24px -18px #0006,0 10px 30px #0007}
#L.blank{visibility:hidden}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;transition:transform .65s cubic-bezier(.5,.05,.3,1);z-index:5}
.leaf.fwd{left:var(--pw);transform-origin:left center}
.leaf.bck{left:0;transform-origin:right center}
.leaf.fwd.go{transform:rotateY(-180deg)}
.leaf.bck.go{transform:rotateY(180deg)}
.leaf .f,.leaf .b{position:absolute;inset:0;background:#fbf8ef;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.leaf .b{transform:rotateY(180deg)}
.leaf img{width:100%;height:100%;object-fit:contain;display:block}
#rng{flex:1;min-width:0;accent-color:var(--brass)}
#lbl{font-size:.85rem;color:#a9b8ae;white-space:nowrap}
.nav{width:2.6rem;padding:.5rem 0;font-size:1.2rem;line-height:1}
@media(prefers-reduced-motion:reduce){.leaf{transition-duration:.01s}}
#splash{position:fixed;inset:0;z-index:100;background:#151a24;display:grid;place-items:center;transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
.lg{width:min(70vw,280px);height:auto;overflow:visible;animation:lgin .35s ease-out both,lgp .5s 1.9s ease-in-out}
.lg .half{transform-origin:512px 500px;animation:opn .9s .25s cubic-bezier(.3,1.25,.4,1) both}
.lg .blk{animation:fadeb .3s both}
.lg .arrow{stroke-dasharray:1;stroke-dashoffset:1;animation:drw .6s 1.15s ease-out forwards}
@keyframes opn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeb{from{opacity:0}to{opacity:1}}
@keyframes drw{to{stroke-dashoffset:0}}
@keyframes lgin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes lgp{50%{transform:scale(1.05)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.in #home{animation:rise .6s ease both}
/* virada de página: leitura em uma página (celular) */
#book:not(.dual) .leaf.fwd{left:0}
#book:not(.dual) .leaf.fwd.go{opacity:0}
#book:not(.dual) .leaf{transition:transform .65s cubic-bezier(.5,.05,.3,1),opacity .3s .35s}
.leaf.sb{left:0;transform-origin:left center;transform:rotateY(-180deg);opacity:0}
.leaf.sb.go{transform:rotateY(0);opacity:1}
#book:not(.dual) .leaf.sb{transition:transform .65s cubic-bezier(.5,.05,.3,1),opacity .25s}
.leaf .f,.leaf .b{box-shadow:0 0 18px #0005}
@media(prefers-reduced-motion:reduce){.lg,.lg *{animation:none!important}.lg .arrow{stroke-dashoffset:0}body.in #home{animation:none}}
.empty{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:16px;margin-top:.6rem}
.empty b{font-size:1rem;margin:0}.empty span{display:block;color:var(--mu);font-size:.85rem;margin-top:.1rem}
.empty .pill{margin-left:auto;padding:.5rem .9rem;font-size:.9rem;flex:none}
.lh{display:flex;align-items:baseline;justify-content:space-between;margin-top:.8rem}.lh h2{margin:0}.lh span{color:var(--mu);font-size:.9rem}
.srch{width:100%;margin:.9rem 0 .7rem;padding:.75rem 1rem;border:1px solid var(--ln);border-radius:14px;background:var(--tint);color:var(--tx);font:inherit;font-size:1rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -1.1rem;padding:0 1.1rem .3rem}
.chips button{flex:none;border:1px solid var(--ln);border-radius:999px;padding:.45rem .85rem;font-size:.88rem;color:var(--mu);transition:background .2s,color .2s}
.chips button.on{background:var(--g);color:var(--og);border-color:var(--g);font-weight:700}
.chips i{font-style:normal;opacity:.7;margin-left:.15rem}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem .7rem;margin-top:1rem}
.bs{display:flex;flex-direction:column}
.sh{border-bottom:7px solid var(--ln);margin:0 -.35rem;padding:0 .35rem;box-shadow:0 8px 8px -8px #0004}
.bc{position:relative;width:100%;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 6px 12px #0003}
.bc img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.bc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,#0006,#fff2 60%,transparent);z-index:1}
.bc i{position:absolute;left:0;bottom:0;height:4px;background:var(--g);z-index:2}
.bc em{position:absolute;left:.35rem;bottom:.35rem;font-style:normal;font-size:.68rem;font-weight:700;background:var(--g);color:var(--og);border-radius:999px;padding:.12rem .5rem;z-index:2}
.ed2{position:absolute;top:.25rem;right:.25rem;width:1.7rem;height:1.7rem;border-radius:50%;background:#000a;color:#fff;font-size:.85rem;z-index:3}
.bs p{margin:.6rem 0 0;font-size:.82rem;font-weight:600;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib0{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;padding:4rem 1rem}.lib0 .bigb{font-size:3rem}.lib0 b{font-size:1.2rem}.lib0 span{color:var(--mu);margin-bottom:.6rem}
.c{text-align:center}
.tabin{animation:tabin .35s ease both}
@keyframes tabin{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
.tabs button.on span{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.tabin,.tabs button.on span{animation:none}}
#zo,#zl,#zi{padding:.5rem .6rem!important;min-width:2.2rem}#zl{font-size:.8rem}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg class="lg" viewBox="0 270 1024 450" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"><defs><g id="hb"><path d="M205 402 28 732C205 665 395 600 485 672"/><path d="M205 402C305 365 440 340 500 372"/><path d="M243 440 122 642C250 598 410 572 500 628"/><path d="M243 440C330 402 440 385 500 408"/></g></defs><g class="half"><use href="#hb"/></g><g class="half"><use href="#hb" transform="translate(1024 0) scale(-1 1)"/></g><path class="blk" d="M486 692H538"/><path class="arrow" pathLength="1" d="M512 690V290M474 326 512 288 550 326"/></svg></div>
<section id="home">
  <div class="hd"><div class="av" role="img" aria-label="Perfil"></div><h1 style="position:absolute;left:-9999px">Entrelinhas</h1><button class="pill" id="add">+ PDF</button></div>
  <div id="main"></div>
  <nav class="tabs"><button data-t="home" class="on"><span>🏠</span>Início</button><button data-t="shelf"><span>📚</span>Biblioteca</button><button data-t="me"><span>👤</span>Perfil</button></nav>
</section>
<section id="reader" hidden>
  <div class="top"><button id="back">‹ Voltar</button><div id="title"></div><button id="zo" aria-label="Diminuir zoom">−</button><button id="zl" aria-label="Voltar ao tamanho normal">100%</button><button id="zi" aria-label="Aumentar zoom">+</button><button id="edr" aria-label="Editar livro">✎</button></div>
  <div id="stage"><div id="book" class="dual"><div id="L" class="pg blank"></div><div id="R" class="pg"></div></div></div>
  <div class="bot">
    <button class="nav" id="prev" aria-label="Página anterior">‹</button>
    <input id="rng" type="range" min="1" max="1" value="1" aria-label="Ir para a página">
    <span id="lbl"></span>
    <button class="nav" id="next" aria-label="Próxima página">›</button>
  </div>
</section>
<input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
<input id="photo" type="file" accept="image/*" hidden>
<div id="toast" hidden></div>
<div id="edd" hidden><div class="dlg" role="dialog" aria-labelledby="et"><b id="et">Editar livro</b><label>Nome do livro<input id="en" maxlength="80"></label><label>Página atual <span id="ept"></span><input id="ep" type="number" min="1" inputmode="numeric"></label><button class="pill" id="es">Salvar</button><button class="del" id="ex">Excluir livro</button><button id="ec">Cancelar</button></div></div>
<div id="perm" hidden><div class="dlg" role="dialog" aria-labelledby="pt"><b id="pt">Permitir acesso aos arquivos</b><p>Para adicionar PDFs, o app precisa abrir os arquivos do seu aparelho e guardar os livros no armazenamento dele. Você escolhe quais PDFs entram; o app não vê o resto dos seus arquivos.</p><button class="pill" id="ok">Permitir e escolher PDF</button><button id="no">Agora não</button></div></div>

<script>
const $=s=>document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- armazenamento (IndexedDB, com reserva em memória) ---------- */
let mem=[];
const dbp=new Promise(res=>{try{const r=indexedDB.open('livros',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('b',{keyPath:'id'});r.result.createObjectStore('f',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function tx(st,mode,fn){const d=await dbp;if(!d)return null;
  return new Promise(res=>{try{const t=d.transaction(st,mode),r=fn(t.objectStore(st));
    t.oncomplete=()=>res(r&&r.result===undefined?true:r&&r.result);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}})}
async function getAll(){const r=await tx('b','readonly',s=>s.getAll());return Array.isArray(r)?r:mem}
async function put(b,blob){
  const m={...b};delete m.blob;
  const ok=await tx('b','readwrite',s=>s.put(m));
  if(ok&&blob)await tx('f','readwrite',s=>s.put({id:b.id,blob}));
  if(!ok){const i=mem.findIndex(x=>x.id===b.id);const v={...m,blob:blob||(mem[i]&&mem[i].blob)};if(i<0)mem.push(v);else mem[i]=v}
}
async function getBlob(id){const r=await tx('f','readonly',s=>s.get(id));if(r&&r.blob)return r.blob;const m=mem.find(x=>x.id===id);return m&&m.blob}
async function del(id){await tx('b','readwrite',s=>s.delete(id));await tx('f','readwrite',s=>s.delete(id));mem=mem.filter(x=>x.id!==id)}

/* ---------- início e estante ---------- */
const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};

function avatar(){const n=lsGet('nome',''),f=lsGet('foto','');
  document.querySelectorAll('.av').forEach(a=>{const big=a.classList.contains('big');
    if(f)a.innerHTML='<img src="'+f+'" alt="">';
    else if(n)a.textContent=n[0].toUpperCase();
    else if(big)a.textContent='👤';
    else a.innerHTML='<img src="'+LOGO+'" alt="">'})}
function profile(all,m){
  const nm=lsGet('nome',''),th=lsGet('tema','auto'),ac=lsGet('acesso','')==='1';
  const st=all.filter(b=>b.started!==false),done=st.filter(b=>(b.page||1)>=(b.n%2?b.n-1:b.n)).length,pages=st.reduce((a,b)=>a+(b.page||1),0);
  m.innerHTML=`<div class="me"><button class="avw" id="ph" aria-label="Adicionar foto de perfil"><div class="av big"></div><span class="plus">+</span></button><label>Seu nome<input id="nm" maxlength="30" value="${esc(nm)}" placeholder="Como quer ser chamado?">${lsGet('foto','')?'<button class="rmf" id="rmf">Remover foto</button>':''}</label></div>
<div class="stats"><div><b>${st.length}</b><span>em leitura</span></div><div><b>${done}</b><span>concluídos</span></div><div><b>${pages}</b><span>páginas lidas</span></div></div>
<h2>Aparência</h2><div class="seg">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([v,l])=>`<button data-th="${v}" class="${th===v?'on':''}">${l}</button>`).join('')}</div>
<h2>Arquivos</h2><p class="mu">${ac?'Acesso aos arquivos permitido.':'Acesso aos arquivos ainda não permitido.'}</p><button class="pill" data-add>Adicionar PDF</button>`;avatar();
}
$('#main').addEventListener('click',e=>{const t=e.target.closest('[data-th]');if(t){lsSet('tema',t.dataset.th);applyTheme();render()}});
$('#main').addEventListener('input',e=>{if(e.target.id==='nm'){lsSet('nome',e.target.value.trim());avatar()}});
$('#main').addEventListener('click',e=>{
  if(e.target.closest('#ph'))$('#photo').click();
  if(e.target.closest('#rmf')){try{localStorage.removeItem('foto')}catch(err){}avatar();render()}
});
$('#photo').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader(),im=new Image();
  rd.onload=()=>{im.src=rd.result};
  im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);
    lsSet('foto',c.toDataURL('image/jpeg',.85));avatar();render()};
  im.onerror=()=>toast('Não consegui abrir essa imagem.');
  rd.readAsDataURL(f);
});
let q='',flt='all',LIB=[];
const status=b=>b.started===false?'new':((b.page||1)>=(b.n%2?b.n-1:b.n)&&b.n>1?'done':'now');
function library(all,m){
  LIB=all;
  if(!all.length){m.innerHTML='<div class="lib0"><div class="bigb">📚</div><b>Sua biblioteca está vazia</b><span>Os PDFs que você adicionar aparecem aqui.</span><button class="pill" data-add>Adicionar PDF</button></div>';return}
  const cnt=k=>all.filter(b=>k==='all'||status(b)===k).length;
  m.innerHTML=`<div class="lh"><h2>Biblioteca</h2><span>${all.length} ${all.length>1?'livros':'livro'}</span></div><input id="q" class="srch" type="search" placeholder="Buscar pelo nome" value="${esc(q)}"><div class="chips">${[['all','Todos'],['now','Lendo'],['new','Não iniciados'],['done','Concluídos']].map(([k,l])=>`<button data-f="${k}" class="${flt===k?'on':''}">${l} <i>${cnt(k)}</i></button>`).join('')}</div><div id="lg"></div>`;
  libGrid();
}
function libGrid(){
  const l=LIB.filter(b=>(flt==='all'||status(b)===flt)&&b.name.toLowerCase().includes(q.toLowerCase()));
  $('#lg').innerHTML=l.length?'<div class="shelf">'+l.map(b=>{const st=status(b);
    return `<div class="bk bs" data-id="${b.id}"><div class="sh"><div class="bc"><img src="${b.cover}" alt=""><button class="ed2" data-ed="${b.id}" aria-label="Editar ${esc(b.name)}">✎</button>${st==='done'?'<em>Lido</em>':st==='new'?'<em>Novo</em>':'<i style="width:'+pct(b)+'%"></i>'}</div></div><p>${esc(b.name)}</p></div>`}).join('')+'</div>':'<p class="mu c">Nenhum livro encontrado.</p>';
}
$('#main').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;libGrid()}});
$('#main').addEventListener('click',e=>{const c=e.target.closest('[data-f]');if(c){flt=c.dataset.f;render()}});
let tab='home';
const pct=b=>Math.round((b.page||1)/b.n*100);
const tile=(b,rm)=>`<div class="bk" data-id="${b.id}"><div class="cv" style="background:${b.col}"><img src="${b.cover}" alt="">${rm?`<button class="rm ed" data-ed="${b.id}" aria-label="Editar ${esc(b.name)}">✎</button><button class="rm" data-rm="${b.id}" aria-label="Remover ${esc(b.name)}">×</button>`:''}<i style="width:${pct(b)}%"></i></div><p>${esc(b.name)}</p><small>${pct(b)}% lido</small></div>`;
async function render(){
  const all=(await getAll()).sort((a,b)=>b.t-a.t),m=$('#main'),bs=tab==='shelf'?all:all.filter(b=>b.started!==false);
  if(tab==='me')return profile(all,m);
  if(tab==='shelf')return library(all,m);
  if(!bs.length){m.innerHTML='<div class="empty"><div><b>Nenhum livro em leitura</b><span>Adicione um PDF para começar.</span></div><button class="pill" data-add>Adicionar</button></div>';return}
  if(tab==='shelf'){m.innerHTML='<h2>Estante</h2><div class="grid">'+bs.map(b=>tile(b,1)).join('')+'</div>';return}
  const c=bs[0];
  m.innerHTML=`<div class="hero bk" data-id="${c.id}"><div class="cv" style="background:${c.col}"><img src="${c.cover}" alt=""><i style="width:${pct(c)}%"></i></div><div><b>${esc(c.name)}</b><span>Página ${c.page||1} de ${c.n}</span><br><button>Continuar lendo</button></div></div><h2>Seus livros</h2><div class="row">${bs.map(b=>tile(b)).join('')}</div>`;
}
$('#main').addEventListener('click',async e=>{
  if(e.target.closest('[data-add]'))return askAccess();
  const ed=e.target.closest('[data-ed]');
  if(ed){e.stopPropagation();return editBook(ed.dataset.ed)}
  const r=e.target.closest('[data-rm]');
  if(r){e.stopPropagation();await del(r.dataset.rm);toast('Livro removido da estante');return render()}
  const b=e.target.closest('.bk');if(b)openBook(b.dataset.id);
});
const tabOrder=['home','shelf','me'];
document.querySelectorAll('.tabs button').forEach(t=>t.onclick=async()=>{
  const prev=tab;tab=t.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===t));
  await render();
  const m=$('#main');m.style.setProperty('--dx',(tabOrder.indexOf(tab)>tabOrder.indexOf(prev)?28:-28)+'px');
  m.classList.remove('tabin');void m.offsetWidth;m.classList.add('tabin');m.scrollTop=0;
});
function askAccess(){
  let ok=false;try{ok=localStorage.getItem('acesso')==='1'}catch(e){}
  if(ok)return $('#file').click();
  $('#perm').hidden=false;
}
$('#ok').onclick=()=>{
  $('#perm').hidden=true;
  try{localStorage.setItem('acesso','1')}catch(e){}
  let p=null;try{if(navigator.storage&&navigator.storage.persist)p=navigator.storage.persist()}catch(e){}
  $('#file').click();
  if(p)p.then(g=>{if(!g)toast('O navegador pode apagar os livros se faltar espaço no aparelho.')},()=>{});
};
$('#no').onclick=()=>$('#perm').hidden=true;
$('#add').onclick=askAccess;

/* ---------- abrir PDF ---------- */
async function mkCover(doc){
  const p=await doc.getPage(1),v=p.getViewport({scale:1}),vp=p.getViewport({scale:300/v.width});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const s=document.createElement('canvas');s.width=s.height=1;const x=s.getContext('2d');x.drawImage(c,0,0,1,1);
  const d=x.getImageData(0,0,1,1).data;
  return{cover:c.toDataURL('image/jpeg',.8),col:`rgb(${d[0]},${d[1]},${d[2]})`,ratio:v.width/v.height};
}
$('#file').addEventListener('change',async e=>{
  const fs=[...e.target.files];e.target.value='';
  if(!fs.length)return;
  if(fs.length>1)return addMany(fs);
  const f=fs[0];
  if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))return toast('Escolha um arquivo no formato PDF.');
  toast('Abrindo o livro…');
  try{
    const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    let b=(await getAll()).find(x=>x.name===f.name.replace(/\.pdf$/i,'')&&x.size===f.size);
    if(!b){b={id:Date.now()+'',name:f.name.replace(/\.pdf$/i,''),size:f.size,n:doc.numPages,page:1,t:Date.now(),...await mkCover(doc)};await put(b,f)}
    startRead(b,doc);
  }catch(err){toast('Não consegui abrir este PDF. Ele pode estar protegido por senha ou danificado.')}
});
async function addMany(fs){
  let k=0;toast('Adicionando '+fs.length+' PDFs…');
  for(const f of fs){
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))continue;
    try{
      const name=f.name.replace(/\.pdf$/i,'');
      if((await getAll()).some(x=>x.name===name&&x.size===f.size))continue;
      const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      await put({id:Date.now()+'-'+k,name,size:f.size,n:doc.numPages,page:1,t:Date.now(),started:false,...await mkCover(doc)},f);k++;
    }catch(e){}
  }
  toast(k?k+' PDF(s) na estante':'Nenhum PDF novo foi adicionado');
  tab='shelf';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='shelf'));render();
}
let edId=null;
const bookById=async id=>cur&&cur.id===id?cur:(await getAll()).find(x=>x.id===id);
async function editBook(id){
  const b=await bookById(id);if(!b)return;
  edId=id;$('#ex').textContent='Excluir livro';$('#ex').dataset.sure='';$('#en').value=b.name;$('#ep').value=b.page||1;$('#ep').max=b.n;
  $('#ept').textContent='(de '+b.n+')';$('#edd').hidden=false;
}
$('#ec').onclick=()=>{$('#edd').hidden=true};
$('#ex').onclick=async()=>{
  const x=$('#ex');
  if(!x.dataset.sure){x.dataset.sure='1';x.textContent='Toque de novo para excluir';return}
  const id=edId;await del(id);$('#edd').hidden=true;
  if(cur&&cur.id===id){cur=null;$('#reader').hidden=true;$('#home').hidden=false}
  await render();toast('Livro excluído');
};
$('#es').onclick=async()=>{
  const b=await bookById(edId);if(!b)return;
  const nm=$('#en').value.trim(),p=parseInt($('#ep').value,10);
  if(nm)b.name=nm;
  if(p>=1)b.page=Math.min(b.n,p);
  $('#edd').hidden=true;
  if(cur&&cur.id===b.id){$('#title').textContent=b.name;await go(dual?Math.floor(b.page/2):b.page-1,false)}
  else{await put(b);render()}
  toast('Livro atualizado');
};
$('#edr').onclick=()=>cur&&editBook(cur.id);
async function openBook(id){
  const b=(await getAll()).find(x=>x.id===id),bl=await getBlob(id);
  if(!b||!bl)return toast('Não encontrei o arquivo deste livro. Adicione o PDF de novo.');
  try{startRead(b,await pdfjsLib.getDocument({data:await bl.arrayBuffer()}).promise)}
  catch(e){toast('Não consegui abrir este livro.')}
}

/* ---------- leitor em formato de livro ---------- */
let pdf,cur,n=0,ratio=.707,cache=new Map(),sp=0,dual=true,busy=false,pw=300,ph=420;
const total=()=>dual?Math.floor(n/2)+1:n;
const slots=s=>dual?[2*s,2*s+1].map(p=>p>n?0:p):[0,s+1];
const first=s=>slots(s).find(Boolean)||1;
function layout(){
  const st=$('#stage'),w=st.clientWidth-24,h=st.clientHeight-24,pg=n?first(sp):1;
  const d=w>=h*ratio*1.7,p=Math.max(80,Math.min(d?w/2:w,h*ratio));
  if(Math.round(p)!==Math.round(pw))cache.clear();
  dual=d;pw=p;ph=p/ratio;
  const b=$('#book');b.style.setProperty('--pw',pw+'px');b.style.setProperty('--ph',ph+'px');
  b.classList.toggle('dual',dual);$('#rng').max=n;
  sp=dual?Math.floor(pg/2):pg-1;
}
async function img(p){
  if(!p)return null;if(cache.has(p))return cache.get(p);
  const page=await pdf.getPage(p),v=page.getViewport({scale:1});
  const k=pw*Math.min(2,window.devicePixelRatio||1)*qual/v.width,vp=page.getViewport({scale:k});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const u=c.toDataURL('image/jpeg',.88);cache.set(p,u);return u;
}
const set=(el,u)=>{el.innerHTML=u?'<img alt="" src="'+u+'">':'';el.classList.toggle('blank',!u)};
async function go(t,anim=true){
  t=Math.max(0,Math.min(total()-1,t));
  if(busy||(anim&&t===sp))return;busy=true;
  const old=sp,[ol,or]=slots(old),[nl,nr]=slots(t);
  const [iol,ior,inl,inr]=await Promise.all([img(ol),img(or),img(nl),img(nr)]);
  const L=$('#L'),R=$('#R'),fwd=t>old;
  if(anim&&t!==old&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    const leaf=document.createElement('div');leaf.className='leaf '+(dual?(fwd?'fwd':'bck'):(fwd?'fwd':'sb'));
    const fr=dual?(fwd?ior:iol):(fwd?ior:inr),bk=dual?(fwd?inl:inr):(fwd?null:inr);
    leaf.innerHTML='<div class="f">'+(fr?'<img alt="" src="'+fr+'">':'')+'</div><div class="b">'+(bk?'<img alt="" src="'+bk+'">':'')+'</div>';
    if(dual){if(fwd)set(R,inr);else set(L,inl)}else if(fwd)set(R,inr);
    $('#book').appendChild(leaf);leaf.getBoundingClientRect();leaf.classList.add('go');
    await new Promise(r=>setTimeout(r,680));
    set(L,inl);set(R,inr);leaf.remove();
  }else{
    set(L,inl);set(R,inr);
    if(anim&&t!==old&&!matchMedia('(prefers-reduced-motion:reduce)').matches)
      R.animate([{transform:'translateX('+(fwd?36:-36)+'px)',opacity:0},{transform:'none',opacity:1}],{duration:280,easing:'ease-out'});
  }
  sp=t;
  const ps=slots(t).filter(Boolean);
  $('#lbl').textContent=(ps.length>1?'Páginas '+ps[0]+'–'+ps[1]:'Página '+ps[0])+' de '+n;
  $('#rng').value=ps[0];$('#prev').disabled=t===0;$('#next').disabled=t===total()-1;
  if(cur&&anim!==null){cur.page=ps[0];cur.t=Date.now();put(cur)}
  busy=false;
  slots(t+1).concat(slots(t-1)).forEach(p=>{if(p>0&&p<=n)img(p)});
}
async function startRead(b,doc){
  pdf=doc;n=doc.numPages;cur=b;b.started=true;cache.clear();zoom=1;zx=zy=0;qual=1;$('#book').style.transform='';$('#zl').textContent='100%';ratio=b.ratio||.707;busy=false;
  $('#title').textContent=b.name;$('#home').hidden=true;$('#reader').hidden=false;
  sp=0;dual=true;layout();
  const pg=Math.min(n,Math.max(1,b.page||1));
  sp=dual?Math.floor(pg/2):pg-1;
  await go(sp,false);
}
$('#back').onclick=async()=>{$('#reader').hidden=true;$('#home').hidden=false;cur=null;await render()};
$('#prev').onclick=()=>go(sp-1);
$('#next').onclick=()=>go(sp+1);
$('#rng').addEventListener('input',e=>{const v=+e.target.value;go(dual?Math.floor(v/2):v-1)});
document.addEventListener('keydown',e=>{
  if($('#reader').hidden)return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(sp+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(sp-1);
});
let zoom=1,zx=0,zy=0,qual=1,pinch=null,pan=null,gest=false;
function applyZoom(){
  const b=$('#book'),st=$('#stage');
  const mx=Math.max(0,(b.offsetWidth*zoom-st.clientWidth)/2+16),my=Math.max(0,(b.offsetHeight*zoom-st.clientHeight)/2+16);
  zx=Math.max(-mx,Math.min(mx,zx));zy=Math.max(-my,Math.min(my,zy));
  b.style.transform=zoom===1?'':'translate('+zx+'px,'+zy+'px) scale('+zoom+')';
  $('#zl').textContent=Math.round(zoom*100)+'%';
}
async function setZoom(z){
  zoom=Math.max(1,Math.min(4,z));if(zoom===1){zx=zy=0}
  applyZoom();
  const q=zoom>1.5?2.5:1;
  if(q!==qual){qual=q;cache.clear();while(busy)await new Promise(r=>setTimeout(r,50));await go(sp,false)}
}
$('#zi').onclick=()=>setZoom(zoom+.5);
$('#zo').onclick=()=>setZoom(zoom-.5);
$('#zl').onclick=()=>setZoom(1);
const stg=$('#stage'),dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stg.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15))}},{passive:false});
stg.addEventListener('click',e=>{
  if(gest||zoom>1)return;
  const r=$('#book').getBoundingClientRect();
  if(e.clientY<r.top||e.clientY>r.bottom)return;
  go(e.clientX<r.left+r.width/2?sp-1:sp+1);
});
stg.addEventListener('touchstart',e=>{
  if(e.touches.length===2){pinch={d:dist(e.touches),z:zoom};pan=null;gest=true}
  else if(e.touches.length===1&&!pinch){pan={x:e.touches[0].clientX,y:e.touches[0].clientY,ox:zx,oy:zy,moved:false}}
},{passive:true});
stg.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){zoom=Math.max(1,Math.min(4,pinch.z*dist(e.touches)/pinch.d));applyZoom();e.preventDefault()}
  else if(pan&&zoom>1&&e.touches.length===1){
    const dx=e.touches[0].clientX-pan.x,dy=e.touches[0].clientY-pan.y;
    if(Math.abs(dx)+Math.abs(dy)>6)pan.moved=true;
    zx=pan.ox+dx;zy=pan.oy+dy;applyZoom();e.preventDefault()}
},{passive:false});
stg.addEventListener('touchend',e=>{
  if(pinch){if(e.touches.length<2){pinch=null;setZoom(zoom);setTimeout(()=>gest=false,300)}return}
  if(!pan)return;
  const p=pan;pan=null;
  if(zoom>1){if(p.moved){gest=true;setTimeout(()=>gest=false,300)}return}
  const dx=e.changedTouches[0].clientX-p.x;
  if(Math.abs(dx)>50){e.preventDefault();go(dx<0?sp+1:sp-1)}
});
let rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!n||$('#reader').hidden)return;layout();busy=false;go(sp,false)},200)});
$('.av').onclick=()=>$('[data-t="me"]').click();
applyTheme();avatar();render();
(()=>{const sp0=$('#splash'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(()=>{sp0.classList.add('out');document.body.classList.add('in');setTimeout(()=>sp0.remove(),700)},rm?500:2400)})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
